name: build-ubuntu
on: [push, pull_request]
jobs:

  ubuntu_latest_cmake:
    runs-on: ubuntu-latest
    name: Ubuntu CMake ${{ matrix.tests }} tests ${{ matrix.install }} install ${{ matrix.python }} Python
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: with
            install: without
            python: without
          - tests: without
            install: with
            python: without
          - tests: with
            install: without
            python: with
    steps:
      - name: Clone and check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}} # Branch where changes are implemented.
          repository: ${{github.event.pull_request.head.repo.full_name}} # Repo where changes are implemented.
      - name: Check commit
        run: |
          git log -1
      - name: Update OS
        run: sudo apt-get update
      - name: Install apt-get dependencies
        run: sudo apt-get install -y gfortran gcc g++ openmpi-bin libopenmpi-dev libblas-dev liblapack-dev libeigen3-dev cmake
      - name: Install python dependencies
        if: matrix.python == 'with'
        run: sudo apt-get -y install python3-minimal python3-pip python3-numpy
      - name: Build boost-python for python3 (not provided by apt-cache)
        if: matrix.python == 'with'
        run : |
          sudo apt-get -y install wget
          wget https://sourceforge.net/projects/boost/files/boost/1.79.0/boost_1_79_0.tar.gz
          tar -xf boost_1_79_0.tar.gz
          cd boost_1_79_0
          ./bootstrap.sh --with-libraries=python --with-python=/usr/bin/python3 --with-toolset=gcc
          sudo ./b2 toolset=gcc install
          sudo apt-get install locate
          sudo updatedb
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake \
            $([ "${{ matrix.tests }}" == "with" ] && echo "-DEXAMPLES=ON -DMPI=ON -DICB=ON -DEIGEN=ON" || echo "") \
            $([ "${{ matrix.python }}" == "with" ] && echo "-DPYTHON3=ON" || echo "") \
            ..
      - name: Build and install
        if: matrix.install == 'with'
        run: |
          bash ./build/tstCMakeInstall.sh
      - name: Build and install '64-'
        if: matrix.install == 'with'
        run: |
          bash ./build/tstCMakeInstall.sh 64-
      - name: Build and install '-ILP64'
        if: matrix.install == 'with'
        run: |
          bash ./build/tstCMakeInstall.sh   -ILP64
      - name: Build and install '64-ILP64'
        if: matrix.install == 'with'
        run: |
          bash ./build/tstCMakeInstall.sh 64-ILP64
      - name: Build
        if: matrix.tests == 'with'
        run: |
          cd build
          make all
      - name: Run tests
        if: matrix.tests == 'with'
        run: |
          cd build
          CTEST_OUTPUT_ON_FAILURE=1 make test
      - name: Create source package
        if: matrix.tests == 'with'
        run: |
          cd build
          make package_source

  ubuntu_latest_autotools:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu autotools with MPI running tests
            tests: with
            install: without
            blas: BLAS
            configure-flags: --enable-mpi --enable-icb --enable-eigen
          - name: Ubuntu autotools different integer sizes with installation
            tests: without
            install: with
            blas: BLAS
            configure-flags:
          - name: Ubuntu autotools using MKL
            tests: with
            install: without
            blas: MKL
            configure-flags: --enable-icb --with-blas=mkl_gf_ilp64 --with-lapack=mkl_gf_ilp64
          - name: Ubuntu autotools with non-default MPI prefix
            tests: with
            install: without
            blas: BLAS
            configure-flags: >-
              --enable-mpi=${GITHUB_WORKSPACE}/openmpi
              --enable-icb --enable-eigen
            mpi-location: non-default
          - name: Ubuntu autotools with non-default MPI directories
            tests: with
            install: without
            blas: BLAS
            configure-flags: >-
              --enable-mpi
              --with-mpi-includedir=${GITHUB_WORKSPACE}/openmpi/include
              --with-mpi-libdir=${GITHUB_WORKSPACE}/openmpi/lib
              --enable-icb --enable-eigen
            mpi-location: non-default
    steps:
      - name: Clone and check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}} # Branch where changes are implemented.
          repository: ${{github.event.pull_request.head.repo.full_name}} # Repo where changes are implemented.
      - name: Check commit
        run: |
          git log -1
      - name: Update OS
        run: sudo apt-get update
      - name: Install apt-get dependencies
        run: |
          sudo apt-get install -y \
            gfortran gcc g++ \
            $([ "${{ matrix.mpi-location }}" == "non-default" ] \
              && echo "libevent-dev libpmix-dev libucx-dev zlib1g-dev libhwloc-dev \
                       pkgconf libibverbs-dev libfabric-dev libnuma-dev \
                       libpsm-infinipath1-dev libpsm2-dev flex" \
              || echo "openmpi-bin libopenmpi-dev") \
            $([ "${{ matrix.blas }}" != "BLAS" ] || echo "libblas-dev liblapack-dev") \
            libeigen3-dev automake autoconf pkg-config libtool
          if [ "${{ matrix.blas }}" == "MKL" ]; then
            echo "::group::Install Intel MKL (ILP64 BLAS/LAPACK)"
            echo yes | sudo apt-get -y install intel-mkl libmkl-dev
            echo "::endgroup::"
          fi
      - name: Setup environment for MKL
        if: matrix.blas == 'MKL'
        run: |
          echo "FFLAGS=-DMKL_ILP64 -I/usr/include/mkl" >> $GITHUB_ENV
          echo "FCFLAGS=-DMKL_ILP64 -I/usr/include/mkl" >> $GITHUB_ENV
          echo "LIBS=-Wl,--no-as-needed -L/usr/lib/x86_64-linux-gnu -lmkl_sequential -lmkl_core -lpthread -lm -ldl" >> $GITHUB_ENV
          echo "INTERFACE64=1" >> $GITHUB_ENV
      - name: Restore OpenMPI from cache
        if: ${{ matrix.mpi-location == 'non-default' }}
        id: openmpi-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/openmpi
          key: openmpi:ubuntu
      - name: Build and install OpenMPI at non-default prefix
        if: ${{ matrix.mpi-location == 'non-default' && steps.openmpi-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "::group::Download release tarball"
          curl -o openmpi-5.0.10.tar.bz2 https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.bz2
          echo "::endgroup::"
          echo "::group::Unpack release tarball"
          tar -xf openmpi-5.0.10.tar.bz2
          echo "::endgroup::"
          echo "::group::Configure OpenMPI"
          mkdir -p openmpi-5.0.10/.build
          cd openmpi-5.0.10/.build
          ../configure \
            --with-pmix=external \
            --with-libevent=external \
            --with-hwloc=external \
            --disable-silent-rules \
            --enable-ipv6 \
            --with-devel-headers \
            --with-slurm \
            --with-sge \
            --without-tm \
            --prefix=${GITHUB_WORKSPACE}/openmpi
          echo "::endgroup::"
          echo "::group::Build OpenMPI"
          make all -j$(nproc)
          echo "::endgroup::"
          echo "::group::Install OpenMPI"
          make install
          echo "::endgroup::"
      - name: Setup environment for OpenMPI at non-default prefix
        if: ${{ matrix.mpi-location == 'non-default' }}
        run: |
          # Prepend path to compiler wrappers
          echo "${GITHUB_WORKSPACE}/openmpi/bin" >> "$GITHUB_PATH"
      - name: Store OpenMPI in cache
        if: ${{ matrix.mpi-location == 'non-default' && steps.openmpi-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/openmpi
          key: ${{ steps.openmpi-cache.outputs.cache-primary-key }}
      - name: Configure
        run: |
          ./bootstrap
          ./configure ${{ matrix.configure-flags }}
      - name: Build and install
        if: matrix.install == 'with'
        run: |
          bash ./tstAutotoolsInstall.sh
      - name: Build and install '64-'
        if: matrix.install == 'with'
        run: |
          bash ./tstAutotoolsInstall.sh 64-
      - name: Build and install '-ILP64'
        if: matrix.install == 'with'
        run: |
          bash ./tstAutotoolsInstall.sh   -ILP64
      - name: Build and install '64-ILP64'
        if: matrix.install == 'with'
        run: |
          bash ./tstAutotoolsInstall.sh 64-ILP64
      - name: Build
        if: matrix.tests == 'with'
        run: |
          make all
      - name: Run checks
        if: matrix.tests == 'with'
        run: |
          make check
      - name: Run distchecks
        if: matrix.tests == 'with' && matrix.blas != 'MKL'
        run: |
          make distcheck
